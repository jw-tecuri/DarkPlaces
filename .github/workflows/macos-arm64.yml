name: macOS arm64

# Native Apple Silicon app bundle.
# Pushes to master and manual runs build and test only.
# A tag publishes a release: tags containing "-test" are pre-releases,
# every other matching tag is a normal Latest release.
# Examples: darkplaces-20261031-macos-arm64, darkplaces-arm64-test2.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "darkplaces-*-macos-arm64"
      - "darkplaces-arm64-test*"

permissions:
  contents: write

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  COPYFILE_DISABLE: "1"
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  LIBJPEG_TURBO_VERSION: "3.2.1"
  SDL2_VERSION: "2.32.10"

jobs:
  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm Apple Silicon runner
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test "$(uname -m)" = "arm64"

      - name: Install Homebrew dependencies
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          # Do not install Homebrew sdl2. Current bottles are the sdl2-compat shim,
          # which dlopens libSDL3 and keeps an @loader_path rpath into opt/sdl3.
          brew install cmake libpng libogg libvorbis theora freetype libxmp curl pkgconf
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Build SDL 2.32 from source
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          prefix="$RUNNER_TEMP/sdl2"
          src="$RUNNER_TEMP/sdl2-src"
          mkdir -p "$src"
          curl -fL --retry 3 -o "$RUNNER_TEMP/SDL2.tar.gz" \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          tar -xzf "$RUNNER_TEMP/SDL2.tar.gz" -C "$src" --strip-components=1
          cmake -S "$src" -B "$src/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF \
            -DSDL_FRAMEWORK=OFF
          cmake --build "$src/build" -j"$(sysctl -n hw.ncpu)"
          cmake --install "$src/build"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          export PATH="$prefix/bin:$PATH"
          version="$(sdl2-config --version)"
          echo "built sdl2-config ${version}"
          echo "sdl2 --libs: $(sdl2-config --libs)"
          test "$version" = "$SDL2_VERSION"
          sdl_lib="$(find "$prefix/lib" -name 'libSDL2*.dylib' ! -type l | head -n 1)"
          test -n "$sdl_lib"
          echo "SDL dylib: $sdl_lib"
          otool -L "$sdl_lib"
          echo "---- LC_RPATH ----"
          otool -l "$sdl_lib" | awk '/cmd LC_RPATH/{p=1} p && /path /{print; p=0}'
          if strings "$sdl_lib" | grep -E -q 'libSDL3|sdl2-compat|opt/sdl3'; then
            echo "built library is the sdl2-compat shim, not SDL2 ${SDL2_VERSION}"
            exit 1
          fi
          echo "SDL_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Build libjpeg-turbo with the libjpeg 6b ABI
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          prefix="$RUNNER_TEMP/libjpeg62"
          src="$RUNNER_TEMP/libjpeg-turbo-src"
          mkdir -p "$src"
          curl -fL --retry 3 -o "$RUNNER_TEMP/libjpeg-turbo.tar.gz" \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_TURBO_VERSION}/libjpeg-turbo-${LIBJPEG_TURBO_VERSION}.tar.gz"
          tar -xzf "$RUNNER_TEMP/libjpeg-turbo.tar.gz" -C "$src" --strip-components=1
          cmake -S "$src" -B "$src/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DENABLE_SHARED=ON \
            -DENABLE_STATIC=OFF \
            -DWITH_JPEG7=OFF \
            -DWITH_JPEG8=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_TOOLS=OFF \
            -DWITH_TESTS=OFF
          cmake --build "$src/build" -j"$(sysctl -n hw.ncpu)"
          cmake --install "$src/build"
          ls -l "$prefix/lib"
          test -e "$prefix/lib/libjpeg.62.dylib"
          echo "JPEG_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Build DarkPlaces client and dedicated server
        run: |
          set -euo pipefail
          export PATH="${SDL_PREFIX}/bin:/opt/homebrew/bin:$PATH"
          # chmod on a tracked script flips the index to dirty and git describe
          # then appends '~'. Run a copy so the checkout stays clean.
          cp .github/scripts/cc-with-headerpad.sh "$RUNNER_TEMP/cc-with-headerpad.sh"
          chmod +x "$RUNNER_TEMP/cc-with-headerpad.sh"
          printf '%s\n' '#!/bin/bash' 'strip -x "$@" || strip "$@" || true' > "$RUNNER_TEMP/strip-safe.sh"
          chmod +x "$RUNNER_TEMP/strip-safe.sh"
          if ! git diff --quiet; then
            echo "tracked files changed before the build; refusing a -dirty version string"
            git status --porcelain
            git diff
            exit 1
          fi
          git_describe="$(git describe --tags --always --dirty=-dirty)"
          echo "git describe: ${git_describe}"
          case "$git_describe" in
            *-dirty|*~) echo "describe is dirty"; exit 1 ;;
          esac
          echo "GIT_DESCRIBE=${git_describe}" >> "$GITHUB_ENV"
          # CFSTR() in vid_sdl.c needs CoreFoundation in addition to IOKit.
          # Use the SDL 2.32 we just built, not whatever sdl2-config Homebrew has.
          sdl_libs="$(sdl2-config --libs)"
          echo "sdl2 --version: $(sdl2-config --version)"
          echo "sdl2 --libs: ${sdl_libs}"
          make -j"$(sysctl -n hw.ncpu)" sdl-release sv-release \
            CC="$RUNNER_TEMP/cc-with-headerpad.sh" \
            STRIP="$RUNNER_TEMP/strip-safe.sh" \
            CFLAGS_EXTRA="-arch arm64 -mmacosx-version-min=11.0" \
            LDFLAGS_MACOSXSDL="-lm -lz -ldl -framework IOKit -framework CoreFoundation ${sdl_libs}"
          test -x darkplaces-sdl
          test -x darkplaces-dedicated
          lipo -archs darkplaces-sdl | grep -qx arm64
          lipo -archs darkplaces-dedicated | grep -qx arm64
          echo "---- darkplaces-sdl ----"
          otool -L darkplaces-sdl
          echo "---- darkplaces-dedicated ----"
          otool -L darkplaces-dedicated

      - name: Bundle DarkPlaces.app
        run: |
          set -euo pipefail
          short_version="$(date -u +%Y.%m.%d)"
          bundle_version="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          git_describe="${GIT_DESCRIBE}"
          case "$git_describe" in
            *-dirty|*~) echo "refusing to stamp a dirty describe: ${git_describe}"; exit 1 ;;
          esac
          commit="$(git rev-parse HEAD)"
          python3 .github/scripts/macos_bundle.py bundle \
            --app dist/DarkPlaces.app \
            --exe darkplaces-sdl \
            --dedicated darkplaces-dedicated \
            --dedicated-dir dist/dedicated \
            --icon Darkplaces.app/Contents/Resources/Darkplaces.icns \
            --jpeg-prefix "$JPEG_PREFIX" \
            --extra-libdir "$SDL_PREFIX/lib" \
            --version-short "$short_version" \
            --version-bundle "$bundle_version" \
            --git-describe "$git_describe" \
            --commit "$commit"
          test "$(plutil -extract CFBundleIdentifier raw dist/DarkPlaces.app/Contents/Info.plist)" = "io.github.darkplacesengine.darkplaces"
          test "$(plutil -extract CFBundleExecutable raw dist/DarkPlaces.app/Contents/Info.plist)" = "darkplaces-sdl"
          test -f dist/DarkPlaces.app/Contents/Resources/Darkplaces.icns
          echo "---- bundled client ----"
          otool -L dist/DarkPlaces.app/Contents/MacOS/darkplaces-sdl
          echo "---- bundled dedicated ----"
          otool -L dist/dedicated/darkplaces-dedicated

      - name: dlopen the libraries DarkPlaces searches for
        run: |
          set -euo pipefail
          clang -arch arm64 -mmacosx-version-min=11.0 -o "$RUNNER_TEMP/dlopen_check" .github/scripts/dlopen_check.c
          fw="dist/DarkPlaces.app/Contents/MacOS/../Frameworks"
          "$RUNNER_TEMP/dlopen_check" \
            "$fw/libjpeg.62.dylib" jpeg_CreateDecompress \
            "$fw/libpng16.16.dylib" png_create_read_struct \
            "$fw/libogg.dylib" ogg_sync_init \
            "$fw/libvorbis.dylib" vorbis_info_init \
            "$fw/libvorbisfile.dylib" ov_open_callbacks \
            "$fw/libvorbisenc.dylib" vorbis_encode_init \
            "$fw/libtheora.dylib" theora_decode_header \
            "$fw/libfreetype.6.dylib" FT_Init_FreeType \
            "$fw/libfreetype.dylib" FT_Init_FreeType \
            "$fw/libxmp.4.dylib" xmp_create_context \
            "$fw/libxmp.dylib" xmp_create_context \
            "$fw/libcurl.4.dylib" curl_easy_init
          ded="dist/dedicated"
          "$RUNNER_TEMP/dlopen_check" \
            "$ded/libjpeg.62.dylib" jpeg_CreateDecompress \
            "$ded/libpng16.16.dylib" png_create_read_struct \
            "$ded/libvorbis.dylib" vorbis_info_init \
            "$ded/libvorbisfile.dylib" ov_open_callbacks \
            "$ded/libogg.dylib" ogg_sync_init \
            "$ded/libtheora.dylib" theora_decode_header \
            "$ded/libcurl.4.dylib" curl_easy_init

      - name: Smoke test without a display, GPU, or game data
        run: |
          set -euo pipefail
          export SMOKE_BASEDIR="$(mktemp -d)"
          # Dedicated server does not link SDL, so it can start with no display.
          python3 .github/scripts/macos_smoke.py 20 dist/dedicated/darkplaces-dedicated
          # The app binary must print and exit by itself. A timeout is a failure:
          # sdl2-compat aborts in its initializer (or blocks on the SDL3 dialog)
          # before main, which previously looked like a silent hang.
          app_base="$(mktemp -d)"
          mkdir -p "$app_base/id1"
          printf '%s\n' 'quit' > "$app_base/id1/quake.rc"
          SMOKE_BASEDIR="$app_base" SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 .github/scripts/macos_smoke.py --must-exit 20 \
            dist/DarkPlaces.app/Contents/MacOS/darkplaces-sdl

      - name: Package DMG and zip
        run: |
          set -euo pipefail
          python3 .github/scripts/macos_bundle.py audit dist/DarkPlaces.app
          python3 .github/scripts/macos_bundle.py audit dist/dedicated

          dmg_src="$(mktemp -d)"
          cp -R dist/DarkPlaces.app "$dmg_src/DarkPlaces.app"
          ln -s /Applications "$dmg_src/Applications"
          rm -f DarkPlaces-macos-arm64.dmg
          hdiutil create -volname "DarkPlaces" -srcfolder "$dmg_src" -ov -format UDZO DarkPlaces-macos-arm64.dmg

          mount="$(mktemp -d)"
          hdiutil attach DarkPlaces-macos-arm64.dmg -nobrowse -readonly -mountpoint "$mount"
          detach() { hdiutil detach "$mount" || hdiutil detach -force "$mount" || true; }
          trap detach EXIT
          test -d "$mount/DarkPlaces.app"
          test -L "$mount/Applications"
          test "$(readlink "$mount/Applications")" = "/Applications"
          codesign --verify --deep --strict --verbose=2 "$mount/DarkPlaces.app"
          python3 .github/scripts/macos_bundle.py audit "$mount/DarkPlaces.app"
          trap - EXIT
          detach
          codesign --verify --deep --strict --verbose=2 dist/DarkPlaces.app

          stage="$(mktemp -d)/DarkPlaces-macos-arm64"
          mkdir -p "$stage/dedicated"
          cp -R dist/DarkPlaces.app "$stage/DarkPlaces.app"
          cp -R dist/dedicated/. "$stage/dedicated/"
          cp .github/scripts/macos-arm64-readme.txt "$stage/README.txt"
          rm -f DarkPlaces-macos-arm64.zip
          ditto -c -k --keepParent "$stage" DarkPlaces-macos-arm64.zip
          shasum -a 256 DarkPlaces-macos-arm64.dmg DarkPlaces-macos-arm64.zip | tee SHA256SUMS

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DarkPlaces-macos-arm64
          path: |
            DarkPlaces-macos-arm64.dmg
            DarkPlaces-macos-arm64.zip
            SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "tracked files are dirty at publish time"
            git status --porcelain
            git diff
            exit 1
          fi
          case "${GIT_DESCRIBE}" in
            *-dirty|*~) echo "refusing to publish a dirty describe: ${GIT_DESCRIBE}"; exit 1 ;;
          esac
          tag="${GITHUB_REF_NAME}"
          {
            echo "Unofficial macOS Apple Silicon build of DarkPlaces from the jw-tecuri/DarkPlaces fork (not an upstream DarkPlacesEngine release)."
            echo
            echo "Ad-hoc signed with \`codesign --force --sign -\`. Not notarized. Gatekeeper will block a downloaded app until you right-click Open, or run \`xattr -dr com.apple.quarantine DarkPlaces.app\`."
            echo
            echo "No Quake game data is shipped."
            echo
            echo "Default game-data path on macOS: if \`DarkPlaces.app/Contents/Resources/id1\` exists, \`Contents/Resources\` is the base directory. Otherwise the base directory is the folder that contains \`DarkPlaces.app\` (place \`id1/pak0.pak\` next to the app). Override with \`-basedir /path/to/quake\` where that path contains \`id1/\`. Config and saves go to \`~/Library/Application Support/darkplaces/\` unless you pass \`-nohome\`."
            echo
            echo "Example: \`open DarkPlaces.app --args -basedir /Games/Quake\`"
            echo
            echo "The DMG contains DarkPlaces.app and an /Applications shortcut. The zip also contains \`dedicated/darkplaces-dedicated\` and the dylibs that binary dlopens. Run it with \`./dedicated/darkplaces-dedicated -dedicated -basedir /Games/Quake\`."
            echo
            echo "OpenGL is deprecated on macOS. This build still requests an OpenGL 3.2 Core context (macOS provides up to OpenGL 4.1). SDL is SDL2 ${SDL2_VERSION} built from source, not Homebrew sdl2-compat (that shim dlopens libSDL3). JPG/PNG/Ogg Vorbis/Theora/FreeType/libxmp/curl are dlopen'd from Contents/Frameworks using the engine's macOS sonames (libjpeg is the v6b ABI, \`libjpeg.62.dylib\`, not Homebrew's libjpeg v8 bottle)."
            echo
            echo "Commit: \`${GIT_DESCRIBE}\` (\`${GITHUB_SHA}\`)"
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > release-notes.md
          title="DarkPlaces for macOS (Apple Silicon)"
          release_flag="--latest"
          if [[ "$tag" == *-test* ]]; then
            title="DarkPlaces macOS arm64 ${tag} (unofficial)"
            release_flag="--prerelease"
          fi
          # Never delete darkplaces-arm64-test1 or test2. If this tag was
          # republished, replace its assets without moving the git tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber \
              DarkPlaces-macos-arm64.dmg \
              DarkPlaces-macos-arm64.zip \
              SHA256SUMS
            gh release edit "$tag" --title "$title" --notes-file release-notes.md "$release_flag"
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              "$release_flag" \
              DarkPlaces-macos-arm64.dmg \
              DarkPlaces-macos-arm64.zip \
              SHA256SUMS
          fi
